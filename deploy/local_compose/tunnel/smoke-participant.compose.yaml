# Stand-in for the participant application: only a public gateway that echoes
# the Host header, joined to the smoke tunnel network so the sidecars can reach
# Headscale and the local ACME server. Its aliases match participant.compose.yaml,
# so the test covers the tunnel override replacing them (see smoke.sh).
name: txb-tunnel-smoke-participant
services:
  public-gateway:
    image: nginxinc/nginx-unprivileged:1.30.4-alpine3.24@sha256:adf5042a17f4ecdd200c595fa9ffd1be37efb18f89a830bd1a00e4ab4d59d42c
    configs:
      - source: smoke-gateway
        target: /etc/nginx/conf.d/default.conf
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 5s
    networks:
      public:
        aliases:
          - ${PARTICIPANT_PUBLIC_HOST:?PARTICIPANT_PUBLIC_HOST must be set}
          - ${PARTICIPANT_ROLE:?PARTICIPANT_ROLE must be set}-did
          - ${PARTICIPANT_ROLE:?PARTICIPANT_ROLE must be set}-public

  # Trusts the local ACME server's TLS certificate.
  tailnet-tls:
    volumes:
      - ${SMOKE_ACME_CA_FILE:?SMOKE_ACME_CA_FILE must be set}:/certs/acme-ca.pem:ro
configs:
  smoke-gateway:
    content: |
      server { listen 80; location / { return 200 "participant-gateway host=$$host\n"; } }
networks:
  public:
    name: txb-tunnel-smoke
    external: true
