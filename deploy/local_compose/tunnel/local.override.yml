# Local-only changes to deploy/compose/tunnel.compose.yaml and
# headscale.compose.yaml: plain HTTP, no ACME, Headscale routed by the ingress.
services:
  tunnel-node:
    ports: !reset []

  traefik:
    command: !override
      - --log.level=INFO
      - --ping.entryPoint=health
      - --entryPoints.health.address=127.0.0.1:8082
      - --entryPoints.web.address=:80
      - --entryPoints.web.transport.respondingTimeouts.readTimeout=0s
      - --entryPoints.web.transport.respondingTimeouts.writeTimeout=0s
      - --entryPoints.web.transport.respondingTimeouts.idleTimeout=180s
      - --providers.file.directory=/etc/traefik/dynamic
    ports: !reset []
    secrets: !reset []
    networks:
      tunnel: {}
      internet:
        # Docker DNS has no wildcards: list the public names served by the
        # ingress. The consumer's name follows from BPNL00000003AZQP.
        aliases:
          - headscale.tunnel.test
          - bpnl00000003azqp.tunnel.test

networks:
  internet:
    name: ${TX_BOOTSTRAP_PUBLIC_NETWORK:-tx-bootstrap-public}
    external: true

configs:
  traefik-dynamic:
    content: |
      http:
        routers:
          headscale:
            rule: Host(`headscale.tunnel.test`)
            priority: 100
            entryPoints: [web]
            service: headscale
          participants:
            rule: HostRegexp(`^[a-z0-9-]+\.tunnel\.test$$`)
            priority: 10
            entryPoints: [web]
            service: participants
            middlewares:
              - per-participant-rate
              - per-participant-concurrency
              - per-client-concurrency
        # Same limits as tunnel.compose.yaml.
        middlewares:
          per-participant-rate:
            rateLimit:
              average: 100
              burst: 200
              period: 1s
              sourceCriterion:
                requestHost: true
          per-participant-concurrency:
            inFlightReq:
              amount: 64
              sourceCriterion:
                requestHost: true
          per-client-concurrency:
            inFlightReq:
              amount: 16
        services:
          headscale:
            loadBalancer:
              servers:
                - url: http://headscale:8080
          participants:
            loadBalancer:
              passHostHeader: true
              servers:
                - url: http://tunnel-node:8080
