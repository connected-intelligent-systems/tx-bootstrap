# Smoke test only: a local ACME server (Pebble) in place of Let's Encrypt.
# Pebble resolves the participant's public name to the ingress through Docker
# DNS and validates TLS-ALPN-01 on port 443, so issuance takes the same path
# through the tunnel as with Let's Encrypt.
services:
  # The console's exporter is covered by service/API tests. This fixture lets
  # the ingress smoke test explicitly approve and withdraw a node address.
  routing-authority:
    image: nginxinc/nginx-unprivileged:1.30.4-alpine3.24@sha256:adf5042a17f4ecdd200c595fa9ffd1be37efb18f89a830bd1a00e4ab4d59d42c
    configs:
      - source: routing-authority
        target: /etc/nginx/conf.d/default.conf
    networks:
      - tunnel

  pebble:
    image: ghcr.io/letsencrypt/pebble:2.8.0@sha256:d9080f68f6cb6af8d82134ab26de0aaaf312ac9cba42aecc6d3aede6cb63007b
    command:
      ["-config", "/etc/pebble/config.json", "-dnsserver", "127.0.0.11:53"]
    environment:
      PEBBLE_VA_NOSLEEP: "1"
      PEBBLE_WFE_NONCEREJECT: "0"
    configs:
      - source: pebble-config
        target: /etc/pebble/config.json
    networks:
      - tunnel

  traefik:
    networks:
      tunnel:
        aliases:
          - ${SMOKE_PARTICIPANT_HOST:?SMOKE_PARTICIPANT_HOST must be set}

configs:
  routing-authority:
    content: |
      server {
        listen 8080;
        location = /routes.map {
          if ($$http_authorization != "Bearer ${TUNNEL_ROUTING_API_KEY:?TUNNEL_ROUTING_API_KEY must be set}") { return 401; }
          root /tmp;
          try_files $$uri =503;
          add_header Cache-Control no-store always;
        }
      }

  pebble-config:
    content: |
      {"pebble": {
        "listenAddress": "0.0.0.0:14000",
        "managementListenAddress": "0.0.0.0:15000",
        "certificate": "/test/certs/localhost/cert.pem",
        "privateKey": "/test/certs/localhost/key.pem",
        "httpPort": 5002,
        "tlsPort": 443
      }}
