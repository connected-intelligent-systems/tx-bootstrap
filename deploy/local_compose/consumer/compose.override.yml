# Local development port overrides
# This file is loaded by deploy/local_compose/scripts/up.sh alongside compose.yaml.

services:
  public-gateway:
    ports:
      - "${PUBLIC_HTTP_BIND:-127.0.0.1}:${CONSUMER_PUBLIC_HTTP_HOST_PORT:-19284}:80"

  participant-api-gateway:
    ports:
      - "${INTERNAL_HTTP_BIND:-127.0.0.1}:${CONSUMER_API_HTTP_HOST_PORT:-19282}:80"

  portal-gateway:
    ports:
      - "${INTERNAL_HTTP_BIND:-127.0.0.1}:${CONSUMER_INTERNAL_HTTP_HOST_PORT:-19283}:80"
