apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tx-bootstrap-operator.componentName" (dict "root" . "component" "issuer-service") }}
  labels:
    {{- include "tx-bootstrap-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: issuer-service
spec:
  replicas: {{ .Values.issuerService.replicaCount }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  selector:
    matchLabels:
      {{- include "tx-bootstrap-operator.selectorLabels" (dict "root" . "component" "issuer-service") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "tx-bootstrap-operator.selectorLabels" (dict "root" . "component" "issuer-service") | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- include "tx-bootstrap-operator.podDefaults" . | nindent 6 }}
      containers:
        - name: issuer-service
          image: {{ include "tx-bootstrap-operator.image" (dict "root" . "image" .Values.issuerService.image) | quote }}
          imagePullPolicy: {{ .Values.issuerService.image.pullPolicy }}
          securityContext:
            {{- include "tx-bootstrap-operator.containerSecurityContext" (dict "root" . "component" .Values.issuerService.securityContext) | nindent 12 }}
          ports:
            - { name: control, containerPort: 8081 }
            - { name: issuance, containerPort: 8082 }
            - { name: did, containerPort: 8083 }
            - { name: version, containerPort: 8084 }
            - { name: sts, containerPort: 8085 }
            - { name: issuer-admin, containerPort: 8086 }
            - { name: identity, containerPort: 8087 }
            - { name: status-list, containerPort: 8088 }
          env:
            {{- include "tx-bootstrap-operator.javaEnv" . | nindent 12 }}
            - { name: WEB_HTTP_PORT, value: "8081" }
            - { name: WEB_HTTP_PATH, value: /api }
            - { name: WEB_HTTP_ISSUANCE_PORT, value: "8082" }
            - { name: WEB_HTTP_ISSUANCE_PATH, value: /api/issuance }
            - { name: WEB_HTTP_DID_PORT, value: "8083" }
            - { name: WEB_HTTP_DID_PATH, value: / }
            - { name: WEB_HTTP_VERSION_PORT, value: "8084" }
            - { name: WEB_HTTP_VERSION_PATH, value: /.well-known/api }
            - { name: WEB_HTTP_STS_PORT, value: "8085" }
            - { name: WEB_HTTP_STS_PATH, value: /api/sts }
            - { name: WEB_HTTP_ISSUERADMIN_PORT, value: "8086" }
            - { name: WEB_HTTP_ISSUERADMIN_PATH, value: /api/admin }
            - { name: WEB_HTTP_IDENTITY_PORT, value: "8087" }
            - { name: WEB_HTTP_IDENTITY_PATH, value: /api/identity }
            - { name: WEB_HTTP_STATUSLIST_PORT, value: "8088" }
            - { name: WEB_HTTP_STATUSLIST_PATH, value: /statuslist }
            - name: EDC_IAM_DID_WEB_USE_HTTPS
              value: {{ .Values.identity.useHttpsDidWeb | quote }}
            - name: EDC_IAM_ACCESSTOKEN_JTI_VALIDATION
              value: {{ .Values.issuerService.jtiValidation | quote }}
            - { name: EDC_IAM_CREDENTIAL_REVOCATION_MIMETYPE, value: application/json }
            - { name: EDC_ISSUER_STATUSLIST_SIGNING_KEY_ALIAS, value: default }
            - name: EDC_STATUSLIST_CALLBACK_ADDRESS
              value: "http://{{ include "tx-bootstrap-operator.componentName" (dict "root" . "component" "issuer-did") }}/statuslist"
            - name: EDC_ENCRYPTION_AES_KEY_ALIAS
              value: {{ .Values.issuerService.encryptionKeyAlias | quote }}
            - name: EDC_ENCRYPTION_STRICT
              value: {{ .Values.issuerService.encryptionStrict | quote }}
            {{- include "tx-bootstrap-operator.vaultEnv" . | nindent 12 }}
            - name: EDC_VAULT_HASHICORP_API_HEALTH_CHECK_PATH
              value: {{ .Values.vault.healthCheckPath | quote }}
            {{- range $store := list "ISSUANCEPROCESS" "ATTESTATIONDEFINITIONS" "CREDENTIALDEFINITIONS" "DIDRESOURCE" "STSCLIENT" "PARTICIPANT" "PARTICIPANTCONTEXT" "KEYPAIR" "JTI" "CREDENTIALS" "HOLDER" "PARTICIPANTCONTEXTCONFIG" "CUSTOMATTESTATIONS" }}
            - name: EDC_SQL_STORE_{{ $store }}_DATASOURCE
              value: {{ $store | lower }}
            {{- end }}
            {{- range $source := list "DEFAULT" "ISSUANCEPROCESS" "ATTESTATIONDEFINITIONS" "CREDENTIALDEFINITIONS" "DIDRESOURCE" "STSCLIENT" "PARTICIPANT" "PARTICIPANTCONTEXT" "KEYPAIR" "JTI" "CREDENTIALS" "HOLDER" "PARTICIPANTCONTEXTCONFIG" "CUSTOMATTESTATIONS" }}
            - name: EDC_DATASOURCE_{{ $source }}_URL
              {{- include "tx-bootstrap-operator.secretValue" (dict "root" $ "key" "issuerServiceJdbcUrl") | nindent 14 }}
            - name: EDC_DATASOURCE_{{ $source }}_USER
              {{- include "tx-bootstrap-operator.secretValue" (dict "root" $ "key" "issuerServiceDbUser") | nindent 14 }}
            - name: EDC_DATASOURCE_{{ $source }}_PASSWORD
              {{- include "tx-bootstrap-operator.secretValue" (dict "root" $ "key" "issuerServiceDbPassword") | nindent 14 }}
            {{- end }}
          startupProbe:
            httpGet: { path: /api/check/startup, port: control }
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /api/check/startup, port: control }
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /api/check/startup, port: control }
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.issuerService.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "tx-bootstrap-operator.componentName" (dict "root" . "component" "issuer-service") }}
  labels:
    {{- include "tx-bootstrap-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: issuer-service
spec:
  type: {{ .Values.issuerService.service.type }}
  selector:
    {{- include "tx-bootstrap-operator.selectorLabels" (dict "root" . "component" "issuer-service") | nindent 4 }}
  ports:
    - { name: control, port: 8081, targetPort: control }
    - { name: issuance, port: 8082, targetPort: issuance }
    - { name: did, port: 8083, targetPort: did }
    - { name: version, port: 8084, targetPort: version }
    - { name: sts, port: 8085, targetPort: sts }
    - { name: issuer-admin, port: 8086, targetPort: issuer-admin }
    - { name: identity, port: 8087, targetPort: identity }
    - { name: status-list, port: 8088, targetPort: status-list }
