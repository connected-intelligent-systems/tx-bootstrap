apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tx-bootstrap-operator.componentName" (dict "root" . "component" "bdrs") }}
  labels:
    {{- include "tx-bootstrap-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: bdrs
spec:
  replicas: {{ .Values.bdrs.replicaCount }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  selector:
    matchLabels:
      {{- include "tx-bootstrap-operator.selectorLabels" (dict "root" . "component" "bdrs") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "tx-bootstrap-operator.selectorLabels" (dict "root" . "component" "bdrs") | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- include "tx-bootstrap-operator.podDefaults" . | nindent 6 }}
      containers:
        - name: bdrs
          image: {{ include "tx-bootstrap-operator.image" .Values.bdrs.image | quote }}
          imagePullPolicy: {{ .Values.bdrs.image.pullPolicy }}
          securityContext:
            {{- include "tx-bootstrap-operator.containerSecurityContext" (dict "root" . "component" .Values.bdrs.securityContext) | nindent 12 }}
          ports:
            - { name: control, containerPort: 8080 }
            - { name: management, containerPort: 8081 }
            - { name: directory, containerPort: 8082 }
          env:
            {{- include "tx-bootstrap-operator.javaEnv" . | nindent 12 }}
            - { name: WEB_HTTP_PORT, value: "8080" }
            - { name: WEB_HTTP_PATH, value: /api }
            - { name: WEB_HTTP_MANAGEMENT_PORT, value: "8081" }
            - { name: WEB_HTTP_MANAGEMENT_PATH, value: /api/management }
            - { name: WEB_HTTP_MANAGEMENT_AUTH_KEY_ALIAS, value: mgmt-api-key }
            - { name: WEB_HTTP_MANAGEMENT_AUTH_TYPE, value: tokenbased }
            - { name: WEB_HTTP_DIRECTORY_PORT, value: "8082" }
            - { name: WEB_HTTP_DIRECTORY_PATH, value: /api/directory }
            - name: EDC_IAM_DID_WEB_USE_HTTPS
              value: {{ .Values.identity.useHttpsDidWeb | quote }}
            - { name: EDC_IAM_CREDENTIAL_REVOCATION_MIMETYPE, value: application/json }
            - name: EDC_IAM_ISSUER_ID
              value: {{ include "tx-bootstrap-operator.issuerDid" . | quote }}
            - name: EDC_IAM_TRUSTED-ISSUER_0-ISSUER_ID
              value: {{ include "tx-bootstrap-operator.issuerDid" . | quote }}
            {{- include "tx-bootstrap-operator.vaultEnv" . | nindent 12 }}
            - { name: EDC_DATASOURCE_DIDENTRY_NAME, value: didentry }
            - name: EDC_DATASOURCE_DIDENTRY_URL
              {{- include "tx-bootstrap-operator.secretValue" (dict "root" . "key" "bdrsJdbcUrl") | nindent 14 }}
            - name: EDC_DATASOURCE_DIDENTRY_USER
              {{- include "tx-bootstrap-operator.secretValue" (dict "root" . "key" "bdrsDbUser") | nindent 14 }}
            - name: EDC_DATASOURCE_DIDENTRY_PASSWORD
              {{- include "tx-bootstrap-operator.secretValue" (dict "root" . "key" "bdrsDbPassword") | nindent 14 }}
          startupProbe:
            httpGet: { path: /api/check/startup, port: control }
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /api/check/startup, port: control }
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /api/check/startup, port: control }
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.bdrs.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "tx-bootstrap-operator.componentName" (dict "root" . "component" "bdrs") }}
  labels:
    {{- include "tx-bootstrap-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: bdrs
spec:
  type: {{ .Values.bdrs.service.type }}
  selector:
    {{- include "tx-bootstrap-operator.selectorLabels" (dict "root" . "component" "bdrs") | nindent 4 }}
  ports:
    - { name: control, port: 8080, targetPort: control }
    - { name: management, port: 8081, targetPort: management }
    - { name: directory, port: 8082, targetPort: directory }
