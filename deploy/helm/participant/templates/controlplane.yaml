apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tx-bootstrap-participant.componentName" (dict "root" . "component" "controlplane") }}
  labels:
    {{- include "tx-bootstrap-participant.labels" . | nindent 4 }}
    app.kubernetes.io/component: controlplane
spec:
  replicas: {{ .Values.controlPlane.replicaCount }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  selector:
    matchLabels:
      {{- include "tx-bootstrap-participant.selectorLabels" (dict "root" . "component" "controlplane") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "tx-bootstrap-participant.selectorLabels" (dict "root" . "component" "controlplane") | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmaps.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- include "tx-bootstrap-participant.podDefaults" . | nindent 6 }}
      {{- if .Values.jobs.participantInit.enabled }}
      initContainers:
        - name: wait-for-participant-init
          image: {{ include "tx-bootstrap-participant.image" (dict "root" . "image" .Values.participantInit.image) | quote }}
          imagePullPolicy: {{ .Values.participantInit.image.pullPolicy }}
          command:
            - /bin/sh
            - -ec
            - |
              attempts=0
              while [ "$attempts" -lt 180 ]; do
                response="$(curl -sf -H "X-Vault-Token: ${VAULT_TOKEN}" "${VAULT_ADDR}${VAULT_SECRET_PATH}/data/${PARTICIPANT_INIT_MARKER_ALIAS}" 2>/dev/null || true)"
                if [ -n "$response" ] && printf '%s' "$response" | jq -e '.data.data.content == "complete"' >/dev/null 2>&1; then
                  exit 0
                fi
                attempts=$((attempts + 1))
                sleep 2
              done
              echo "participant initialization marker unavailable" >&2
              exit 1
          securityContext:
            {{- include "tx-bootstrap-participant.containerSecurityContext" (dict "root" . "component" .Values.participantInit.securityContext) | nindent 12 }}
          env:
            - name: VAULT_ADDR
              value: {{ .Values.vault.url | quote }}
            - name: VAULT_TOKEN
              {{- include "tx-bootstrap-participant.secretValue" (dict "root" . "key" "vaultToken") | nindent 14 }}
            - name: VAULT_SECRET_PATH
              value: {{ .Values.vault.apiSecretPath | quote }}
            - name: PARTICIPANT_INIT_MARKER_ALIAS
              value: {{ include "tx-bootstrap-participant.participantInitMarkerAlias" . | quote }}
          resources:
            {{- toYaml .Values.jobs.resources | nindent 12 }}
      {{- end }}
      containers:
        - name: controlplane
          image: {{ include "tx-bootstrap-participant.image" (dict "root" . "image" .Values.controlPlane.image) | quote }}
          imagePullPolicy: {{ .Values.controlPlane.image.pullPolicy }}
          securityContext:
            {{- include "tx-bootstrap-participant.containerSecurityContext" (dict "root" . "component" .Values.controlPlane.securityContext) | nindent 12 }}
          ports:
            - { name: default, containerPort: 8080 }
            - { name: management, containerPort: 8081 }
            - { name: catalog, containerPort: 8082 }
            - { name: control, containerPort: 8083 }
            - { name: protocol, containerPort: 8084 }
            - { name: version, containerPort: 8085 }
          env:
            {{- include "tx-bootstrap-participant.javaEnv" . | nindent 12 }}
            - name: EDC_HOSTNAME
              value: {{ include "tx-bootstrap-participant.componentName" (dict "root" . "component" "controlplane") | quote }}
            - name: EDC_PARTICIPANT_ID
              value: {{ include "tx-bootstrap-participant.participantDid" . | quote }}
            - name: EDC_PARTICIPANT_CONTEXT_ID
              value: {{ .Values.identity.participantContextId | quote }}
            - name: TRACTUSX_EDC_PARTICIPANT_BPN
              value: {{ .Values.identity.participantBpn | quote }}
            - name: EDC_IAM_ISSUER_ID
              value: {{ include "tx-bootstrap-participant.participantDid" . | quote }}
            - name: EDC_IAM_DID_WEB_USE_HTTPS
              value: {{ .Values.identity.useHttpsDidWeb | quote }}
            - { name: EDC_IAM_CREDENTIAL_REVOCATION_MIMETYPE, value: application/json }
            - name: EDC_IAM_STS_OAUTH_TOKEN_URL
              value: "http://{{ include "tx-bootstrap-participant.componentName" (dict "root" . "component" "identityhub") }}:8087/api/sts/token"
            - name: EDC_IAM_STS_OAUTH_CLIENT_ID
              value: {{ include "tx-bootstrap-participant.participantDid" . | quote }}
            - { name: EDC_IAM_STS_OAUTH_CLIENT_SECRET_ALIAS, value: sts-oauth-client-secret }
            - name: TX_EDC_IAM_IATP_CREDENTIALSERVICE_URL
              value: "http://{{ include "tx-bootstrap-participant.componentName" (dict "root" . "component" "identityhub") }}:8083/api/credentials/v1/participants/{{ .Values.identity.participantBpnBase64 }}"
            - { name: TX_EDC_IAM_IATP_DEFAULT_SCOPES_MEMBERSHIP_ALIAS, value: org.eclipse.tractusx.vc.type }
            - { name: TX_EDC_IAM_IATP_DEFAULT_SCOPES_MEMBERSHIP_TYPE, value: MembershipCredential }
            - { name: TX_EDC_IAM_IATP_DEFAULT_SCOPES_MEMBERSHIP_OPERATION, value: read }
            - { name: TX_EDC_IAM_IATP_DEFAULT_SCOPES_DATAEXCHANGE_ALIAS, value: org.eclipse.tractusx.vc.type }
            - { name: TX_EDC_IAM_IATP_DEFAULT_SCOPES_DATAEXCHANGE_TYPE, value: DataExchangeGovernanceCredential }
            - { name: TX_EDC_IAM_IATP_DEFAULT_SCOPES_DATAEXCHANGE_OPERATION, value: read }
            - name: EDC_DSP_CALLBACK_ADDRESS
              value: {{ include "tx-bootstrap-participant.dspCallbackAddress" . | quote }}
            - name: TX_EDC_IAM_IATP_BDRS_SERVER_URL
              value: {{ .Values.publicEndpoints.bdrsServerUrl | quote }}
            - name: TX_EDC_IAM_IATP_BDRS_CACHE_VALIDITY
              value: {{ .Values.controlPlane.bdrsCacheValiditySeconds | quote }}
            - { name: TX_EDC_DID_SERVICE_SELF_REGISTRATION_ENABLED, value: "false" }
            - name: EDC_IAM_TRUSTED-ISSUER_0-ISSUER_ID
              value: {{ include "tx-bootstrap-participant.issuerDid" . | quote }}
            - name: EDC_IAM_TRUSTED-ISSUER_0-ISSUER_SUPPORTEDTYPES
              value: {{ .Values.controlPlane.trustedIssuerSupportedTypes | toJson | quote }}
            - { name: WEB_HTTP_PORT, value: "8080" }
            - { name: WEB_HTTP_PATH, value: /api }
            - { name: WEB_HTTP_MANAGEMENT_PORT, value: "8081" }
            - { name: WEB_HTTP_MANAGEMENT_PATH, value: /management }
            - name: WEB_HTTP_MANAGEMENT_AUTH_KEY
              {{- include "tx-bootstrap-participant.secretValue" (dict "root" . "key" "edcApiKey") | nindent 14 }}
            - { name: WEB_HTTP_CATALOG_PORT, value: "8082" }
            - { name: WEB_HTTP_CATALOG_PATH, value: /catalog }
            - { name: WEB_HTTP_CONTROL_PORT, value: "8083" }
            - { name: WEB_HTTP_CONTROL_PATH, value: /control }
            - { name: WEB_HTTP_PROTOCOL_PORT, value: "8084" }
            - { name: WEB_HTTP_PROTOCOL_PATH, value: /api/v1/dsp }
            - { name: WEB_HTTP_VERSION_PORT, value: "8085" }
            - { name: WEB_HTTP_VERSION_PATH, value: /.well-known/api }
            - name: EDC_DATASOURCE_DEFAULT_URL
              {{- include "tx-bootstrap-participant.secretValue" (dict "root" . "key" "edcJdbcUrl") | nindent 14 }}
            - name: EDC_DATASOURCE_DEFAULT_USER
              {{- include "tx-bootstrap-participant.secretValue" (dict "root" . "key" "edcDbUser") | nindent 14 }}
            - name: EDC_DATASOURCE_DEFAULT_PASSWORD
              {{- include "tx-bootstrap-participant.secretValue" (dict "root" . "key" "edcDbPassword") | nindent 14 }}
            {{- include "tx-bootstrap-participant.vaultEnv" . | nindent 12 }}
          volumeMounts:
            - name: logging
              mountPath: /app/logging.properties
              subPath: logging.properties
              readOnly: true
            - name: opentelemetry
              mountPath: /app/opentelemetry.properties
              subPath: opentelemetry.properties
              readOnly: true
          startupProbe:
            httpGet: { path: /api/check/readiness, port: default }
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /api/check/readiness, port: default }
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /api/check/readiness, port: default }
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.controlPlane.resources | nindent 12 }}
      volumes:
        - name: logging
          configMap:
            name: {{ include "tx-bootstrap-participant.componentName" (dict "root" . "component" "edc-logging") }}
        - name: opentelemetry
          configMap:
            name: {{ include "tx-bootstrap-participant.componentName" (dict "root" . "component" "opentelemetry") }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "tx-bootstrap-participant.componentName" (dict "root" . "component" "controlplane") }}
  labels:
    {{- include "tx-bootstrap-participant.labels" . | nindent 4 }}
    app.kubernetes.io/component: controlplane
spec:
  type: {{ .Values.controlPlane.service.type }}
  selector:
    {{- include "tx-bootstrap-participant.selectorLabels" (dict "root" . "component" "controlplane") | nindent 4 }}
  ports:
    - { name: default, port: 8080, targetPort: default }
    - { name: management, port: 8081, targetPort: management }
    - { name: catalog, port: 8082, targetPort: catalog }
    - { name: control, port: 8083, targetPort: control }
    - { name: protocol, port: 8084, targetPort: protocol }
    - { name: version, port: 8085, targetPort: version }
