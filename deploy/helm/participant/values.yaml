nameOverride: ""
fullnameOverride: ""

imagePullSecrets: []

serviceAccount:
  create: true
  name: ""
  annotations: {}
  automountServiceAccountToken: false

podAnnotations: {}
podLabels: {}
terminationGracePeriodSeconds: 30
revisionHistoryLimit: 3
logLevel: info

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

javaRuntime:
  javaToolOptions: -Xmx256m
  otelSdkDisabled: true
  otelJavaagentEnabled: false

identity:
  participantRole: participant
  participantBpn: BPNL000000000002
  participantBpnBase64: "QlBOTDAwMDAwMDAwMDAwMg=="
  participantContextId: 00000000-0000-0000-0000-000000000002
  identityHubParticipantContextId: BPNL000000000002
  participantDidHost: participant.example.invalid
  participantPublicHost: participant.example.invalid
  issuerBpn: BPNL000000000001
  issuerDidHost: issuer.example.invalid
  useHttpsDidWeb: true

publicEndpoints:
  # Empty values are derived from identity.participantPublicHost.
  dspCallbackAddress: ""
  credentialServiceEndpoint: ""
  dataPlaneBaseUrl: ""
  dataPlaneTokenRefreshEndpoint: ""
  bdrsServerUrl: https://issuer.example.invalid/api/directory

vault:
  url: https://vault.example.invalid
  apiSecretPath: /v1/secret
  healthCheckPath: /v1/sys/health

# Provision this Secret before installing the chart. The chart never creates it.
existingSecret:
  name: tx-bootstrap-participant-secrets
  keys:
    vaultToken: vault-token
    identityHubSuperuserApiKey: identityhub-superuser-api-key
    identityHubJdbcUrl: identityhub-jdbc-url
    identityHubDbUser: identityhub-db-user
    identityHubDbPassword: identityhub-db-password
    edcJdbcUrl: edc-jdbc-url
    edcDbUser: edc-db-user
    edcDbPassword: edc-db-password
    portalMigratorDatabaseUrl: portal-migrator-database-url
    portalDatabaseUrl: portal-database-url
    edcApiKey: edc-api-key
    federatedCatalogApiKey: federated-catalog-api-key
    # Optional: when empty, participant-init and the portal retrieve keys from Vault.
    identityHubApiKey: ""
    onboardingRegistrationToken: ""

jobs:
  portalMigrator:
    enabled: true
    backoffLimit: 2
    activeDeadlineSeconds: 300
    serviceAccountName: default
    migrationDirectory: /app/db/migrations
    ownerRole: participant_portal_owner
    runtimeRole: participant_portal
  participantInit:
    enabled: true
    backoffLimit: 2
    activeDeadlineSeconds: 600
  retryTimeoutMs: 120000
  retryDelayMs: 2000
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: "1"
      memory: 256Mi

identityHub:
  replicaCount: 1
  securityContext:
    runAsUser: 10100
    runAsGroup: 101
  image:
    repository: tractusx/identityhub
    tag: 0.3.2
    digest: ""
    pullPolicy: IfNotPresent
  jtiValidation: true
  encryptionKeyAlias: encryption-key
  encryptionStrict: true
  service:
    type: ClusterIP
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi

participantInit:
  securityContext:
    runAsUser: 100
    runAsGroup: 101
  image:
    repository: ghcr.io/connected-intelligent-systems/tx-bootstrap-participant-init
    tag: ""
    digest: ""
    pullPolicy: IfNotPresent
  superuserApiKeyAlias: super-user-apikey

controlPlane:
  replicaCount: 1
  securityContext:
    runAsUser: 10100
    runAsGroup: 101
  image:
    repository: tractusx/edc-controlplane-postgresql-hashicorp-vault
    tag: 0.12.1
    digest: ""
    pullPolicy: IfNotPresent
  bdrsCacheValiditySeconds: 600
  trustedIssuerSupportedTypes:
    - MembershipCredential
    - FrameworkCredential
    - BpnCredential
    - DataExchangeGovernanceCredential
    - DismantlerCredential
  service:
    type: ClusterIP
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi

dataPlane:
  replicaCount: 1
  securityContext:
    runAsUser: 10100
    runAsGroup: 101
  image:
    repository: tractusx/edc-dataplane-hashicorp-vault
    tag: 0.12.1
    digest: ""
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi

federatedCatalog:
  replicaCount: 1
  securityContext:
    runAsUser: 10001
    runAsGroup: 10001
  image:
    repository: ghcr.io/connected-intelligent-systems/tx-bootstrap-federated-catalog
    tag: ""
    digest: ""
    pullPolicy: IfNotPresent
  directoryRefreshIntervalSeconds: 300
  catalogRefreshIntervalSeconds: 900
  crawlConcurrency: 4
  service:
    type: ClusterIP
    port: 8000
  persistence:
    storageClass: ""
    size: 2Gi
    accessModes:
      - ReadWriteOnce
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

portal:
  replicaCount: 1
  securityContext:
    runAsUser: 1000
    runAsGroup: 1000
  image:
    repository: ghcr.io/connected-intelligent-systems/tx-bootstrap-participant-portal-backend
    tag: ""
    digest: ""
    pullPolicy: IfNotPresent
  title: Participant Portal
  name: Participant Portal
  upstreamTimeoutMs: 10000
  preview:
    allowedPrivateHosts: []
  dataProxy:
    timeoutMs: 300000
    maxRequestBytes: 52428800
    allowedPrivateHosts: []
  httpsHeaders: true
  rateLimit:
    enabled: true
    max: 300
    window: 1 minute
  auth:
    mode: forwarded-header
    header: x-forwarded-user
    allowedUsers: []
    allowInsecure: false
  onboarding:
    dataspaceAdminApiUrl: https://onboarding.example.invalid/api
    organizationName: ""
    requestedBpn: ""
    contactEmail: ""
    requestedRole: participant
    did: ""
    dspEndpoint: ""
    credentialServiceEndpoint: ""
  service:
    type: ClusterIP
    port: 3000
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi

publicGateway:
  replicaCount: 1
  securityContext:
    runAsUser: 101
    runAsGroup: 101
  image:
    repository: nginxinc/nginx-unprivileged
    tag: 1.30.4-alpine3.24
    digest: ""
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 500m
      memory: 128Mi

internalGateway:
  replicaCount: 1
  securityContext:
    runAsUser: 101
    runAsGroup: 101
  image:
    repository: nginxinc/nginx-unprivileged
    tag: 1.30.4-alpine3.24
    digest: ""
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 500m
      memory: 128Mi

# Optional: publish the public gateway through the operator's tunnel instead
# of ingress.public. Use the tunnel settings from the operator: HEADSCALE_URL
# and TAILNET_HOSTNAME here, PARTICIPANT_PUBLIC_HOST and PARTICIPANT_DID_HOST as
# identity.participantPublicHost and identity.participantDidHost, and
# TAILNET_AUTHKEY in existingSecret under tunnel.authKeySecretKey.
# The node runs in userspace mode (no capabilities, no TUN device) and only
# forwards tailnet TCP 18080 to the public gateway.
tunnel:
  enabled: false
  headscaleUrl: ""
  hostname: ""
  # Key in existingSecret that holds TAILNET_AUTHKEY.
  authKeySecretKey: tailnet-authkey
  securityContext:
    runAsUser: 1000
    runAsGroup: 1000
  image:
    repository: tailscale/tailscale
    tag: v1.104.4
    digest: sha256:ed6480b33c6eb67c9cbd203ed42b9fb57e361986725b6856def71b7a3d9e276c
    pullPolicy: IfNotPresent
  # The participant's own TLS endpoint behind the operator's TLS-passthrough
  # ingress. It obtains a certificate for identity.participantPublicHost from
  # the ACME CA with TLS-ALPN-01 through the tunnel; the operator never holds it.
  tls:
    acmeCaServer: https://acme-v02.api.letsencrypt.org/directory
    acmeEmail: ""
    # Request limits for all public traffic (the ingress cannot see requests).
    rateLimit:
      average: 100
      burst: 200
    maxConcurrentRequests: 64
    image:
      repository: traefik
      tag: v3.7.17
      digest: sha256:f4bb143d1135a579b630ed491e17ec50f6f7c9c6a30585ff3d385471d2a86f5a
      pullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 256Mi
  # The key is single-use; after the first start the node identity (and the
  # TLS certificate) live in this volume, so keep it across upgrades.
  persistence:
    existingClaim: ""
    storageClassName: ""
    size: 1Gi
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

ingress:
  public:
    enabled: false
    className: ""
    annotations: {}
    hosts:
      - participant.example.invalid
    path: /
    pathType: Prefix
    tls: []
  internal:
    enabled: false
    className: ""
    annotations: {}
    hosts:
      - portal.example.invalid
    path: /
    pathType: Prefix
    tls: []

nodeSelector: {}
tolerations: []
affinity: {}
