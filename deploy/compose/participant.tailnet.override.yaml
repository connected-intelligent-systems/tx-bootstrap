# Optional participant override: expose the public gateway through a
# Headscale/Tailscale reverse tunnel instead of a self-managed public proxy.
#
# Inbound only. The shared ingress forwards https://${PARTICIPANT_PUBLIC_HOST}
# still encrypted (TLS passthrough) to this node on TCP 18443, where
# tailnet-tls terminates TLS with the participant's own certificate. The
# operator cannot read the traffic. Outbound protocol traffic (DIDs, DSP,
# issuer) uses the normal internet, so tunnelled and directly hosted
# participants share one public dataspace.
#
# Usage (see docs/participant-tunnel.md):
#   docker compose -f oci://ghcr.io/<owner>/tx-bootstrap-participant:<version> \
#     -f participant.tailnet.override.yaml up -d --wait
#
# The operator's enrollment response provides HEADSCALE_URL, TAILNET_HOSTNAME,
# PARTICIPANT_PUBLIC_HOST and PARTICIPANT_DID_HOST, plus a single-use key to
# store in ./secrets/tailnet-authkey (or TAILNET_AUTHKEY_FILE). The key is only
# needed for the first start; the node identity persists in tailnet-state and
# the certificate in tailnet-tls-acme.

services:
  # On the public network the gateway keeps only its role-scoped aliases. The
  # participant's public host name must resolve to the operator's ingress
  # there, as on the internet: tailnet-tls connects to it to detect that the
  # ingress routes the host, and would otherwise reach this gateway and wait
  # forever. The private participant network keeps the public host aliases.
  public-gateway:
    networks:
      public: !override
        aliases:
          - ${PARTICIPANT_ROLE:?PARTICIPANT_ROLE must be set}-did
          - ${PARTICIPANT_ROLE:?PARTICIPANT_ROLE must be set}-public

  # TLS endpoint for the public host. Obtains its certificate from Let's
  # Encrypt with TLS-ALPN-01 through the tunnel itself: no DNS credentials and
  # no further inbound ports.
  tailnet-tls:
    image: traefik:v3.7.17@sha256:f4bb143d1135a579b630ed491e17ec50f6f7c9c6a30585ff3d385471d2a86f5a
    restart: "${RESTART_POLICY:-unless-stopped}"
    init: true
    stop_grace_period: 30s
    logging:
      driver: "${LOG_DRIVER:-json-file}"
      options:
        max-size: "${LOG_MAX_SIZE:-10m}"
        max-file: "${LOG_MAX_FILES:-3}"
    # Starts Traefik (with the command below) once the operator's ingress
    # routes the public host to this node; see the tailnet-tls-start config.
    entrypoint:
      - /bin/sh
      - /etc/traefik/tls-start.sh
      - ${PARTICIPANT_PUBLIC_HOST:?PARTICIPANT_PUBLIC_HOST must be set}
      - 0.0.0.0
      - /acme/acme.json
      - --
    command:
      - --log.level=INFO
      - --ping.entryPoint=health
      - --entryPoints.health.address=127.0.0.1:8082
      - --entryPoints.websecure.address=:8443
      # Data-plane transfers can be large and slow.
      - --entryPoints.websecure.transport.respondingTimeouts.readTimeout=0s
      - --entryPoints.websecure.transport.respondingTimeouts.writeTimeout=0s
      - --entryPoints.websecure.transport.respondingTimeouts.idleTimeout=180s
      - --providers.file.filename=/etc/traefik/dynamic.yaml
      # Static configuration: no file watcher (and no inotify instance).
      - --providers.file.watch=false
      - --certificatesResolvers.acme.acme.tlsChallenge=true
      - --certificatesResolvers.acme.acme.storage=/acme/acme.json
      - --certificatesResolvers.acme.acme.caServer=${TAILNET_ACME_CA_SERVER:-https://acme-v02.api.letsencrypt.org/directory}
      - --certificatesResolvers.acme.acme.email=${TAILNET_ACME_EMAIL:-}
    environment:
      # Extra CA bundle for a private ACME server (tests only).
      LEGO_CA_CERTIFICATES: ${TAILNET_ACME_CA_CERTIFICATES:-}
    configs:
      - source: tailnet-tls
        target: /etc/traefik/dynamic.yaml
      - source: tailnet-tls-start
        target: /etc/traefik/tls-start.sh
    volumes:
      - tailnet-tls-acme:/acme
    networks:
      - public
    depends_on:
      public-gateway:
        condition: service_healthy
      tailnet:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "traefik",
          "healthcheck",
          "--ping",
          "--ping.entryPoint=health",
          "--entryPoints.health.address=127.0.0.1:8082",
        ]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 256

  tailnet:
    image: tailscale/tailscale:v1.104.4@sha256:ed6480b33c6eb67c9cbd203ed42b9fb57e361986725b6856def71b7a3d9e276c
    hostname: ${TAILNET_HOSTNAME:?TAILNET_HOSTNAME must be set}
    restart: "${RESTART_POLICY:-unless-stopped}"
    init: true
    stop_grace_period: 30s
    logging:
      driver: "${LOG_DRIVER:-json-file}"
      options:
        max-size: "${LOG_MAX_SIZE:-10m}"
        max-file: "${LOG_MAX_FILES:-3}"
    # Userspace networking: no NET_ADMIN, no /dev/net/tun, no routing changes.
    environment:
      TS_AUTHKEY: file:/run/secrets/tailnet-authkey
      TS_AUTH_ONCE: "true"
      TS_HOSTNAME: ${TAILNET_HOSTNAME:?TAILNET_HOSTNAME must be set}
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"
      TS_ACCEPT_DNS: "false"
      TS_EXTRA_ARGS: --login-server=${HEADSCALE_URL:?HEADSCALE_URL must be set} --accept-routes=false --ssh=false
      TS_SERVE_CONFIG: /config/serve.json
      TS_ENABLE_HEALTH_CHECK: "true"
      TS_LOCAL_ADDR_PORT: 127.0.0.1:9002
    configs:
      - source: tailnet-serve
        target: /config/serve.json
    secrets:
      - tailnet-authkey
    volumes:
      - tailnet-state:/var/lib/tailscale
    networks:
      - public # reaches public-gateway by alias; has internet egress for Headscale/DERP
    depends_on:
      public-gateway:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-O",
          "/dev/null",
          "http://127.0.0.1:9002/healthz",
        ]
      interval: 10s
      timeout: 3s
      retries: 30
      start_period: 15s
    cap_drop: [ALL]
    # Read-only bypass of file permissions, so root in the container can read
    # the key file (mode 600) when it belongs to a non-root host user.
    cap_add: [DAC_READ_SEARCH]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 256

configs:
  tailnet-serve:
    # Raw TCP forwards. 18443 carries the still-encrypted public traffic to
    # tailnet-tls; 18080 is plain HTTP for setups without TLS (the local
    # stack). The gateway is reached by its role-scoped alias;
    # TAILNET_FORWARD_HOST overrides it, for example with a network alias of
    # your own.
    content: |
      {"TCP": {
        "18443": {"TCPForward": "tailnet-tls:8443"},
        "18080": {"TCPForward": "${TAILNET_FORWARD_HOST:-${PARTICIPANT_ROLE:?PARTICIPANT_ROLE must be set}-public}:80"}
      }}

  tailnet-tls:
    content: |
      http:
        routers:
          public:
            rule: Host(`${PARTICIPANT_PUBLIC_HOST:?PARTICIPANT_PUBLIC_HOST must be set}`)
            entryPoints: [websecure]
            service: gateway
            middlewares: [rate, concurrency]
            tls:
              certResolver: acme
        middlewares:
          # All requests arrive from the operator's ingress, so these limit
          # the participant's total load. Exceeding a limit returns 429.
          rate:
            rateLimit:
              average: ${TAILNET_RATE_LIMIT_AVERAGE:-100}
              burst: ${TAILNET_RATE_LIMIT_BURST:-200}
              period: 1s
          concurrency:
            inFlightReq:
              amount: ${TAILNET_MAX_CONCURRENT_REQUESTS:-64}
        services:
          gateway:
            loadBalancer:
              passHostHeader: true
              servers:
                - url: http://${TAILNET_FORWARD_HOST:-${PARTICIPANT_ROLE:?PARTICIPANT_ROLE must be set}-public}:80

  # Keep in sync with tls-start.sh in the participant Helm chart's tunnel.yaml.
  tailnet-tls-start:
    content: |
      # Usage: sh tls-start.sh HOST LISTEN_ADDRESS ACME_STORAGE -- TRAEFIK_ARGS...
      #
      # Traefik requests its certificate once at startup and does not retry a
      # failed TLS-ALPN-01 challenge until it restarts. The operator's ingress only
      # routes approved participants, so a certificate request made before approval
      # fails, leaves the endpoint without a certificate, and counts against the
      # CA's failed-validation limit. Wait until the public host name reaches this
      # node through the ingress, then start Traefik.
      set -eu
      host="$$1"
      listen="$$2"
      storage="$$3"
      shift 4

      if ! grep -qs "\"main\": *\"$$host\"" "$$storage"; then
        token="$$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')"
        # Answer probes that arrive through the tunnel with this start's token.
        nc -lk -s "$$listen" -p 8443 -e echo "$$token" &
        probe_listener=$$!
        # Report healthy while waiting: approval is an operator decision, and
        # deployments must not time out on it.
        nc -lk -s 127.0.0.1 -p 8082 -e printf 'HTTP/1.0 200 OK\r\nContent-Length: 0\r\n\r\n' &
        health_listener=$$!

        byte() { printf "\\$$(printf %03o "$$1")"; }
        # A minimal TLS ClientHello carrying only the server name the ingress routes by.
        client_hello() {
          n=$${#host}
          byte 22; byte 3; byte 1; byte $$(((n + 56) >> 8)); byte $$(((n + 56) & 255))
          byte 1; byte 0; byte $$(((n + 52) >> 8)); byte $$(((n + 52) & 255)); byte 3; byte 3
          i=0
          while [ "$$i" -lt 32 ]; do byte 0; i=$$((i + 1)); done
          byte 0; byte 0; byte 2; byte 192; byte 47; byte 1; byte 0
          byte $$(((n + 9) >> 8)); byte $$(((n + 9) & 255)); byte 0; byte 0
          byte $$(((n + 5) >> 8)); byte $$(((n + 5) & 255))
          byte $$(((n + 3) >> 8)); byte $$(((n + 3) & 255)); byte 0
          byte $$((n >> 8)); byte $$((n & 255))
          printf %s "$$host"
        }

        echo "Waiting until the operator's ingress routes $$host to this node"
        # BusyBox nc stops reading once its input ends; keep it open for the reply.
        until { client_hello; sleep 10; } | timeout 10 nc "$$host" 443 2>/dev/null | grep -q "$$token"; do
          sleep 5
        done
        kill "$$probe_listener" "$$health_listener"
        wait "$$probe_listener" "$$health_listener" 2>/dev/null || true
        echo "$$host routes to this node; requesting its certificate"
      fi
      exec traefik "$$@"

secrets:
  tailnet-authkey:
    file: ${TAILNET_AUTHKEY_FILE:-./secrets/tailnet-authkey}

volumes:
  tailnet-state:
  tailnet-tls-acme:
