name: Docker images

on:
  workflow_call:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-images-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: operator-console
            context: .
            dockerfile: apps/operator-console/Dockerfile
          - image: operator-onboarding-service
            context: .
            dockerfile: apps/operator-onboarding-service/Dockerfile
          - image: participant-init
            context: apps/participant-init
            dockerfile: apps/participant-init/Dockerfile
          - image: participant-portal-backend
            context: .
            dockerfile: apps/participant-portal/Dockerfile
          - image: federated-catalog
            context: apps/federated-catalog
            dockerfile: apps/federated-catalog/Dockerfile

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Determine stack version
        id: stack-version
        shell: bash
        run: |
          npm run version:check
          development_version="$(node scripts/version.mjs print --dev-sha "$GITHUB_SHA")"
          printf 'development=%s\n' "$development_version" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/tx-bootstrap-${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,format=long
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ steps.stack-version.outputs.development }},priority=900,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build image for security scan
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          load: true
          push: false
          tags: tx-bootstrap-${{ matrix.image }}:scan
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Scan image for known vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: tx-bootstrap-${{ matrix.image }}:scan
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

      - name: Publish image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          provenance: mode=max
          sbom: true

  publish-compose:
    name: Publish Compose artifacts
    if: github.event_name != 'pull_request'
    needs: build
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/compose-artifacts.yml
