name: Local end-to-end

# Runs the local Compose stack from source and negotiates and transfers data
# between the provider and the consumer. The tunnel variant publishes the
# consumer only through the local operator tunnel (Headscale and WireGuard).

on:
  pull_request:
    paths:
      - "apps/**"
      - "packages/**"
      - "deploy/compose/**"
      - "deploy/database/**"
      - "deploy/local_compose/**"
      - ".github/workflows/local-e2e.yml"
  push:
    branches:
      - main
    paths:
      - "apps/**"
      - "packages/**"
      - "deploy/compose/**"
      - "deploy/database/**"
      - "deploy/local_compose/**"
      - ".github/workflows/local-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: local-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tunnel-smoke:
    name: Tunnel smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run tunnel smoke test
        run: deploy/local_compose/tunnel/smoke.sh

  stack:
    name: Stack (${{ matrix.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        mode: [direct, tunnel]
    env:
      TX_BOOTSTRAP_TUNNEL: ${{ matrix.mode == 'tunnel' && '1' || '0' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show Docker versions
        run: |
          docker version --format 'Docker {{.Server.Version}}'
          docker compose version

      - name: Start stack
        run: deploy/local_compose/scripts/up.sh

      - name: Bootstrap participants
        run: deploy/local_compose/scripts/bootstrap.sh

      - name: Run end-to-end flow
        run: deploy/local_compose/scripts/e2e.sh

      - name: Collect container logs
        if: failure()
        run: |
          mkdir -p /tmp/e2e-logs
          docker ps -a --format '{{.Names}}\t{{.Image}}\t{{.Status}}' \
            | tee /tmp/e2e-logs/containers.txt
          for name in $(docker ps -a --format '{{.Names}}'); do
            docker logs --tail 500 "$name" > "/tmp/e2e-logs/$name.log" 2>&1 || true
          done

      - name: Upload container logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: local-e2e-${{ matrix.mode }}-logs
          path: /tmp/e2e-logs
          retention-days: 7

      - name: Stop stack
        if: always()
        run: deploy/local_compose/scripts/down.sh -v
