name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Validate release version
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Match tag to stack version
        run: npm run version:check -- --tag "$GITHUB_REF_NAME"

  images:
    name: Publish images and Compose artifacts
    needs: preflight
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-images.yml

  charts:
    name: Publish Helm charts
    needs: images
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/helm-charts.yml
