name: Quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify repository
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: integration-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      TXB_TEST_DATABASE_URL: postgresql://postgres:integration-test-only@127.0.0.1:5432/postgres

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v4.2.1

      - name: Install pinned tools and dependencies
        run: |
          npm install --global npm@12.0.0
          python -m pip install uv==0.8.6
          npm ci
          uv sync --locked --project apps/federated-catalog

      - name: Verify repository
        run: npm run verify
