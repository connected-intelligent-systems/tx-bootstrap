[project]
name = "tx-bootstrap-federated-catalog"
version = "0.1.6"
description = "Participant-local federated catalog for tx-bootstrap"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.139.2",
  "httpx==0.28.1",
  "pyld==2.0.4",
  "pyoxigraph==0.5.9",
  "uvicorn[standard]==0.35.0",
]

[dependency-groups]
dev = [
  "mypy==1.17.1",
  "pytest==8.4.1",
  "pytest-asyncio==1.1.0",
  "ruff==0.12.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/federated_catalog"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["federated_catalog"]
